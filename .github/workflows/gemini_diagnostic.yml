name: Gemini Management Diagnostic Processor

on:
  issues:
    types: [opened]

jobs:
  process-diagnostic:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Gemini Diagnostic Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python .github/scripts/process_diagnostic.py

      - name: Commit and Push Jekyll Post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/
          git commit -m "docs: Add diagnostic report for Issue #${{ github.event.issue.number }}" || exit 0
          git push

      - name: Leave comment on Issue
        uses: peter-evans/create-or-update-comment@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            🎉 **경영진단 분석이 완료되었습니다!**
            분석 리포트가 GitHub Pages에 업로드되었습니다. [사이트에서 확인하기](https://dmstkd7.github.io/keystone)

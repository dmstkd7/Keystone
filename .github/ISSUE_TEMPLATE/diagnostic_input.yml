name: "경영진단 정보 입력"
description: "진단에 필요한 정보, 회의록, 수치 데이터 등을 자유롭게 입력하세요."
title: "[진단] "
labels: ["diagnostic-request"]
body:
  - type: textarea
    id: raw_data
    attributes:
      label: "경영진단 자료 및 정보"
      description: "기업 정보, 문제점, 현황, 아이디어 등 수집된 정보를 형식 없이 자유롭게 입력하거나 붙여넣으세요."
      placeholder: "예시: ABC 제조기업 최근 매출 20% 감소. 마케팅 비용은 증가했으나 고객 이탈률 높음. 신제품 출시 지연 문제 발생..."
    validations:
      required: true

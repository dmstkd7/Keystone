---
layout: default
---

<div style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
  <!-- Header Bar -->
  <header style="background: #0f172a; border-radius: 12px; padding: 35px; color: #ffffff; margin-bottom: 35px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
    <div style="display: flex; gap: 8px; margin-bottom: 15px;">
      <span style="background: #38bdf8; color: #0f172a; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 700;">MCKINSEY / BCG FRAMEWORK</span>
      <span style="background: rgba(255,255,255,0.15); color: #ffffff; padding: 3px 10px; border-radius: 4px; font-size: 12px;">Gemini AI Automated</span>
    </div>
    <h1 style="font-family: 'Merriweather', serif; font-size: 32px; font-weight: 700; margin: 0 0 15px 0; color: #ffffff; line-height: 1.3;">{{ page.title }}</h1>
    <div style="color: #94a3b8; font-size: 14px; display: flex; gap: 20px;">
      <span>📅 발행일: {{ page.date | date: "%Y-%m-%d" }}</span>
      <span>🏷️ 카테고리: {{ page.categories | join: ", " }}</span>
    </div>
  </header>

  <!-- Post Body Content -->
  <main class="diagnostic-body" style="background: #ffffff; padding: 40px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.03);">
    {{ content }}
  </main>

  <div style="margin-top: 30px; text-align: center;">
    <a href="{{ '/categories' | relative_url }}" style="display: inline-block; background: #0f172a; color: #ffffff; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600;">← 전체 카테고리로 돌아가기</a>
  </div>
</div>
